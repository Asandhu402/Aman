name: Build Windows installer

on:
  push:
    branches:
      - windows-chat-foundation
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install application and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Package Aman
        run: >-
          pyinstaller --noconfirm --clean --windowed --onedir
          --name Aman --collect-all PySide6 --collect-all certifi app.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Download Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"

      - name: Build setup executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/installer" | Out-Null
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "installer/Aman.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Aman-Windows-Installer
          path: dist/installer/Aman-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          target_commitish: main
          name: Aman ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          files: dist/installer/Aman-Setup.exe
