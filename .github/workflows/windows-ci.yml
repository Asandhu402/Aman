name: Windows app checks

on:
  push:
    branches: [main, windows-chat-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app.py local_engine.py model_manager.py runtime_manager.py
